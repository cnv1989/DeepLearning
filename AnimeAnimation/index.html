<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anime Animation Course</title>
<link rel="stylesheet" href="demos/shared/style.css">
<style>
  .hero { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: center; margin: 10px 0 26px; }
  @media (max-width: 760px) { .hero { grid-template-columns: 1fr; } }
  .hero h1 { font-size: 30px; margin: 0 0 8px; }
  .hero p { color: var(--muted); margin: 0; max-width: 60ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
  .card .n { font: 600 12px ui-monospace, monospace; color: var(--accent); }
  .card h3 { margin: 0; font-size: 16px; }
  .card p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; }
  .card .links { display: flex; gap: 12px; font-size: 14px; }
  .card a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .card a:hover { text-decoration: underline; }
  #hero-canvas { width: 100%; border-radius: 12px; background: var(--stage); border: 1px solid var(--line); }
</style>
</head>
<body>
<main>
  <section class="hero">
    <div>
      <h1>Anime Animation: from first sketch to finished cut</h1>
      <p>Ten hands-on lessons. Each one pairs a short written lesson with an interactive demo and readable JavaScript components you can study, tweak and reuse. Then you repeat the exercise in Krita, Clip Studio, OpenToonz, Blender or Live2D.</p>
    </div>
    <canvas id="hero-canvas"></canvas>
  </section>
  <div class="grid" id="lessons"></div>
</main>
<script type="module">
import { setupCanvas, clear } from './demos/shared/ui.js';
import { drawAnimeHead, DEFAULT_FACE } from './src/character/face.js';
import { blinkOpenness } from './src/character/eyes.js';

const LESSONS = [
  ['01', 'Software & the anime pipeline', 'Which apps to use for drawing, animating, rigging and compositing, and how a shot moves through a studio.', 'lessons/01-software-and-pipeline.md', null],
  ['02', 'Proportions in heads', 'Chibi to heroic: how head count sets age and tone.', 'lessons/02-proportions.md', 'demos/01-proportions.html'],
  ['03', 'Face, eyes & expressions', 'Construct the head, layer the anime eye, act with brows and mouth.', 'lessons/03-face-and-eyes.md', 'demos/02-face-builder.html'],
  ['04', 'Line art & cel shading', 'Quantized light, hue-shifted shadows, color keys.', 'lessons/04-line-art-and-cel-shading.md', 'demos/03-cel-shading.html'],
  ['05', 'Timing & spacing', 'Keys vs in-betweens, easing, onion skin, animating on twos.', 'lessons/05-timing-and-spacing.md', 'demos/04-timing.html'],
  ['06', 'Limited animation', 'Lip flap, A-I-U-E-O mouths, blinks, holds.', 'lessons/06-limited-animation.md', 'demos/05-lip-sync.html'],
  ['07', 'Secondary motion', 'Springs and strands: hair that drags, overshoots and settles.', 'lessons/07-secondary-motion.md', 'demos/06-secondary-motion.html'],
  ['08', 'Rigging & walk cycles', 'Bones, forward kinematics, the four key poses, walk personality.', 'lessons/08-rigging-and-walk-cycles.md', 'demos/07-walk-cycle.html'],
  ['09', 'Action effects', 'Anticipation, smears, speed and focus lines, impact frames.', 'lessons/09-action-effects.md', 'demos/08-effects.html'],
  ['10', 'Capstone: a full cut', 'Exposure sheet, acting, dialogue, camera and effects together.', 'lessons/10-capstone-scene.md', 'demos/09-scene.html'],
];

const grid = document.getElementById('lessons');
for (const [n, title, desc, lesson, demo] of LESSONS) {
  const card = document.createElement('article');
  card.className = 'card';
  card.innerHTML = `<span class="n">LESSON ${n}</span><h3></h3><p></p><div class="links"></div>`;
  card.querySelector('h3').textContent = title;
  card.querySelector('p').textContent = desc;
  const links = card.querySelector('.links');
  if (demo) links.insertAdjacentHTML('beforeend', `<a href="${demo}">▶ Demo</a>`);
  links.insertAdjacentHTML('beforeend', `<a href="${lesson}">Read lesson</a>`);
  grid.append(card);
}

const c = document.getElementById('hero-canvas');
const ctx = setupCanvas(c, 320, 300);
function frame(now) {
  const t = now / 1000;
  clear(ctx);
  drawAnimeHead(ctx, {
    ...DEFAULT_FACE, x: 160, y: 118, scale: 0.68, hairStyle: 'long', hairColor: '#f28fb1',
    expression: Math.floor(t / 2.5) % 2 ? 'smile' : 'happy', tilt: Math.sin(t * 1.3) * 4,
    openness: blinkOpenness(t), look: { x: Math.sin(t * 0.7) * 0.6, y: 0 },
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
